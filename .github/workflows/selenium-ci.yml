name: Quiz Form Selenium CI

on:
  push:
    branches: [ main, master, lab12-ai-review ]
  pull_request:
    branches: [ main, master ]

jobs:
  selenium-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Selenium
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Run Selenium boundary tests
        run: |
          if [ -f "test_quiz_form.py" ]; then
            python test_quiz_form.py
          else
            python code/test_quiz_form.py
          fi
